version: '3.8'

services:
  dev-env:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "2222:22"
    restart: unless-stopped
    container_name: dev-base-env
    environment:
      # SSH 代理 (可选): 同时设置 SSH_PROXY_SERVER + SSH_PROXY_PASSWORD 才启用;
      # 值写在项目目录 .env 里 (已 gitignore), 不进镜像
      - SSH_PROXY_SERVER=${SSH_PROXY_SERVER:-}
      - SSH_PROXY_PORT=${SSH_PROXY_PORT:-}
      - SSH_PROXY_USER=${SSH_PROXY_USER:-}
      - SSH_PROXY_PASSWORD=${SSH_PROXY_PASSWORD:-}
    cap_add:
      - NET_ADMIN      # sing-box TUN 需要
    devices:
      - /dev/net/tun   # sing-box TUN 需要
    volumes:
      - uv-cache:/root/.cache/uv

volumes:
  uv-cache:
